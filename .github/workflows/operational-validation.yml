name: Operational Validation

# Manual-only: real Z.ai probe and Docker build/healthcheck validation.
# These jobs are independent — a failure in one does not affect the other.
# Default CI (python-tests.yml) remains offline and unaffected.

on:
  workflow_dispatch:
    inputs:
      validate_zai:
        description: 'Run real Z.ai provider probe (requires ZAI_API_KEY secret)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      validate_docker:
        description: 'Run Docker image build and healthcheck validation'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  issues: write

jobs:
  zai-probe:
    name: Z.ai real provider probe
    runs-on: ubuntu-latest
    if: github.event.inputs.validate_zai == 'true'
    timeout-minutes: 10
    outputs:
      zai_status: ${{ steps.result.outputs.zai_status }}
      zai_detail: ${{ steps.result.outputs.zai_detail }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.15.0"

      - name: Install pinned dependencies (torch excluded)
        run: |
          grep -vE '^[[:space:]]*torch([=<>]|$)' requirements.txt > /tmp/requirements.notorch.txt
          pip install -r /tmp/requirements.notorch.txt

      - name: Check ZAI_API_KEY availability
        id: keycheck
        run: |
          if [ -z "${{ secrets.ZAI_API_KEY }}" ]; then
            echo "zai_status=SKIPPED" >> "$GITHUB_OUTPUT"
            echo "zai_detail=ZAI_API_KEY not configured" >> "$GITHUB_OUTPUT"
            echo "[zai] SKIPPED — ZAI_API_KEY not configured as a repository secret."
          else
            echo "zai_status=CONFIGURED" >> "$GITHUB_OUTPUT"
            echo "zai_detail=ZAI_API_KEY is set" >> "$GITHUB_OUTPUT"
          fi

      - name: Real Z.ai probe
        id: probe
        if: steps.keycheck.outputs.zai_status == 'CONFIGURED'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          python translate_dataset.py \
            --provider zai \
            --model glm-5.3-flash \
            --probe \
            --confirm-external-sharing \
            --timeout 30 \
            > /tmp/zai_probe_raw.txt 2>&1
          PROBE_EXIT=$?
          echo "zai_exit=$PROBE_EXIT" >> "$GITHUB_OUTPUT"
          # Always exit 0 — the classification step reads the output file
          # and determines the actual status (SUCCESS/BLOCKED/FAILED).
          exit 0

      - name: Classify result and show sanitized diagnostics
        id: result
        if: always() && steps.keycheck.outputs.zai_status == 'CONFIGURED'
        run: |
          PROBE_EXIT="${{ steps.probe.outputs.zai_exit || '1' }}"
          RAW="/tmp/zai_probe_raw.txt"

          # Extract only [probe]-prefixed diagnostic lines for display.
          # Raw API responses, tracebacks, and auth headers are never shown.
          if [ -f "$RAW" ]; then
            grep '^\[probe\]' "$RAW" > /tmp/zai_probe_safe.txt || true
          fi

          # Classify based on content patterns in the raw output.
          if [ -f "$RAW" ] && grep -q "insufficient balance\|code 1113\|1113" "$RAW"; then
            echo "zai_status=BLOCKED" >> "$GITHUB_OUTPUT"
            echo "zai_detail=Authenticated, but insufficient balance or resource quota (code 1113)" >> "$GITHUB_OUTPUT"
          elif [ -f "$RAW" ] && grep -q "OK: endpoint reachable" "$RAW"; then
            echo "zai_status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "zai_detail=Authentication verified and real provider response received" >> "$GITHUB_OUTPUT"
          elif [ -f "$RAW" ] && grep -q "FAILED.*auth\|FAILED.*401\|FAILED.*403" "$RAW"; then
            echo "zai_status=FAILED" >> "$GITHUB_OUTPUT"
            echo "zai_detail=Authentication failed" >> "$GITHUB_OUTPUT"
          elif [ -f "$RAW" ] && grep -q "FAILED.*rate_limit\|FAILED.*429" "$RAW"; then
            echo "zai_status=BLOCKED" >> "$GITHUB_OUTPUT"
            echo "zai_detail=Rate limited" >> "$GITHUB_OUTPUT"
          elif [ -f "$RAW" ] && grep -q "FAILED.*timeout\|FAILED.*network\|FAILED.*connection" "$RAW"; then
            echo "zai_status=FAILED" >> "$GITHUB_OUTPUT"
            echo "zai_detail=Network or timeout failure" >> "$GITHUB_OUTPUT"
          else
            echo "zai_status=FAILED" >> "$GITHUB_OUTPUT"
            echo "zai_detail=Probe exited with code $PROBE_EXIT — check the workflow log for details" >> "$GITHUB_OUTPUT"
          fi

          # Display sanitized diagnostic lines in the step summary.
          if [ -f /tmp/zai_probe_safe.txt ] && [ -s /tmp/zai_probe_safe.txt ]; then
            echo "### Sanitized probe diagnostics" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/zai_probe_safe.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report Z.ai result
        if: always()
        run: |
          ZAI_ST="${{ steps.result.outputs.zai_status || 'SKIPPED' }}"
          ZAI_DET="${{ steps.result.outputs.zai_detail || 'Not attempted' }}"
          echo "## Z.ai Provider Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | \`$ZAI_ST\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | $ZAI_DET |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Model | \`glm-5.3-flash\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Endpoint | \`api.z.ai\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Note:** This probe sends one benign test sentence (no dataset content) to verify authentication, model access, and response protocol." >> "$GITHUB_STEP_SUMMARY"

  docker-validation:
    name: Docker build and healthcheck
    runs-on: ubuntu-latest
    if: github.event.inputs.validate_docker == 'true'
    timeout-minutes: 20
    outputs:
      docker_build: ${{ steps.build.outputs.docker_build }}
      docker_health: ${{ steps.health.outputs.docker_health }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker availability
        run: |
          docker version
          docker compose version

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build image
        id: build
        run: |
          docker compose build ui
          echo "docker_build=SUCCESS" >> "$GITHUB_OUTPUT"

      - name: Start container
        id: start
        run: |
          docker compose up -d ui
          echo "container_started=true" >> "$GITHUB_OUTPUT"

      - name: Wait for healthcheck
        id: health
        run: |
          MAX_WAIT=120
          INTERVAL=5
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8501/_stcore/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "docker_health=HEALTHY"
              echo "Healthcheck passed after ${ELAPSED}s"
              exit 0
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "docker_health=UNHEALTHY"
          echo "Healthcheck did not return 200 within ${MAX_WAIT}s"
          docker compose logs ui
          exit 1

      - name: Report Docker result
        if: always()
        run: |
          BUILD="${{ steps.build.outputs.docker_build || 'FAILED' }}"
          HEALTH="${{ steps.health.outputs.docker_health || 'FAILED' }}"
          echo "## Docker Operational Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compose config | validated |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image build | $BUILD |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container startup | started |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Healthcheck | $HEALTH |" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up (containers only, no volumes)
        if: always()
        run: |
          docker compose down --remove-orphans
          echo "[cleanup] Containers removed. Volumes preserved."

  report-to-issue:
    name: Post results to Issue #17
    runs-on: ubuntu-latest
    needs: [zai-probe, docker-validation]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Post validation results to Issue #17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZAI_STATUS: ${{ needs.zai-probe.outputs.zai_status || 'SKIPPED' }}
          ZAI_DETAIL: ${{ needs.zai-probe.outputs.zai_detail || 'Not attempted' }}
          DOCKER_BUILD: ${{ needs.docker-validation.outputs.docker_build || 'SKIPPED' }}
          DOCKER_HEALTH: ${{ needs.docker-validation.outputs.docker_health || 'SKIPPED' }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BODY=$(cat <<EOF
          ## Operational Validation Report
          **Run:** [#${RUN_ID}](${RUN_URL}) · **Timestamp:** ${TIMESTAMP}

          | Validation | Status | Detail |
          |---|---|---|
          | Z.ai provider probe | ${ZAI_STATUS} | ${ZAI_DETAIL} |
          | Docker image build | ${DOCKER_BUILD} | See workflow log |
          | Docker healthcheck | ${DOCKER_HEALTH} | See workflow log |

          Status meanings:
          - **SUCCESS** — validation passed with execution evidence
          - **BLOCKED** — authenticated/started but an external dependency prevented completion
          - **SKIPPED** — not requested or credentials not configured
          - **FAILED** — attempted but failed

          This comment is auto-generated by the operational-validation workflow.
          EOF
          )
          # Use the GitHub API to post a comment on Issue #17
          # (Issue #17 number in the GitHub API is 17)
          PAYLOAD=$(python3 -c "
          import json
          print(json.dumps({'body': '''${BODY}'''}))
          ")
          curl -sS --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/17/comments" \
            -d "$PAYLOAD" \
            -o /dev/null -w "Issue comment: HTTP %{http_code}\n"
