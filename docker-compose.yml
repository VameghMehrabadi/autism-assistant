services:
  ui:
    build: .
    image: autism-assistant:latest
    # Issue #12 — host-side binding defaults to loopback ONLY. The container
    # itself listens on 0.0.0.0 (Dockerfile CMD) so Docker forwarding works;
    # what matters for exposure is the published host address. To expose
    # publicly, use docker-compose.public.yml (BIND_PUBLIC=1 + credential).
    ports:
      - "${UI_BIND_HOST:-127.0.0.1}:${UI_HOST_PORT:-8501}:8501"
    environment:
      AUTISM_CACHE_DIR: /cache
      HF_HOME: /cache/hf
      HF_HUB_CACHE: /cache/hf/hub
      TRANSFORMERS_CACHE: /cache/hf/transformers
      SENTENCE_TRANSFORMERS_HOME: /cache/hf/sentence-transformers
      HF_TOKEN: ${HF_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-}
      BIND_PUBLIC: ${BIND_PUBLIC:-0}
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - model_cache:/cache
    restart: unless-stopped

  # One-off CLI, same image:
  #   docker compose run --rm pipeline main.py --limit 50 --model minilm --fact-lang fa --dataset en
  pipeline:
    image: autism-assistant:latest
    build: .
    profiles: ["cli"]
    environment:
      AUTISM_CACHE_DIR: /cache
      HF_HOME: /cache/hf
      HF_HUB_CACHE: /cache/hf/hub
      TRANSFORMERS_CACHE: /cache/hf/transformers
      SENTENCE_TRANSFORMERS_HOME: /cache/hf/sentence-transformers
      HF_TOKEN: ${HF_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-}
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - model_cache:/cache
    entrypoint: ["python"]
    command: ["main.py", "--help"]

volumes:
  model_cache:
